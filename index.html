<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/svg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="S.N.K Fabrication Works — Premium gates, grills, railings & custom metal fabrication in Bangalore. Quality engineering since 2015." />
    <meta name="theme-color" content="#E65100" />

    <!-- DNS Prefetch & Preconnect for Sanity CDN -->
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://nnh0dbn0.api.sanity.io" />
    <link rel="preconnect" href="https://nnh0dbn0.api.sanity.io" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Intro Logo (Critical Preloader Resource) -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/intro.png"
      fetchpriority="high"
    />

    <!-- Preload Hero Background (Critical LCP Resource) -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/bg.jpg"
      fetchpriority="high"
    />

    <!-- Non-blocking Font Loading -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>S.N.K Fabrication Works | Premium Engineering</title>

    <!-- Inline Critical CSS for Above-the-Fold -->
    <style>
      body {
        margin: 0;
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #FFEDD5 0%, #F8FAFC 50%, #E0F2FE 100%);
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
